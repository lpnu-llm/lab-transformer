<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Mixture-of-Experts: router і два вибрані FFN</title>
<desc id="desc">Після RMSNorm стан токена z надходить у router і вибрані експерти. Router обирає експерти 1 і 3. Їхні виходи змішуються з вагами 0.625 і 0.375 та додаються до residual x. Експерт 2 не обчислюється.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="720" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="36" y="45" font-size="28" fill="#0f172a" text-anchor="start">Mixture-of-Experts: новий router, уже знайомі FFN</text>
<text x="36" y="76" font-size="19" fill="#475569" text-anchor="start">Один токен · 3 експерти · top-2 · заміна FFN-гілки Transformer-блока</text>
<path d="M85 405 V135 H1080 V376" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480" y="125" font-size="18" fill="#475569" text-anchor="start">Residual: переносимо x без змін</text>
<text x="48" y="414" font-size="25" fill="#0f172a" text-anchor="start">x</text>
<path d="M65 405 H135" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="135" y="368" width="150" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="210.0" y="398" font-size="20" fill="#0f172a" text-anchor="middle">RMSNorm</text>
<text x="210.0" y="423" font-size="16" fill="#475569" text-anchor="middle">z = norm(x)</text>
<path d="M285 405 H350" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="350" cy="405" r="5" fill="#2563eb"/>
<text x="325" y="435" font-size="21" fill="#2563eb" text-anchor="start">z</text>
<path d="M350 405 V265 H405" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="405" y="218" width="255" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="532.5" y="248" font-size="20" fill="#0f172a" text-anchor="middle">Router: Linear(D, 3)</text>
<text x="532.5" y="273" font-size="16" fill="#475569" text-anchor="middle">softmax → [0.50, 0.20, 0.30]</text>
<rect x="405" y="368" width="255" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="532.5" y="398" font-size="20" fill="#0f172a" text-anchor="middle">Top-2 + нормування</text>
<text x="532.5" y="423" font-size="16" fill="#475569" text-anchor="middle">1 і 3 → [0.625, 0.375]</text>
<path d="M532 308 V368" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M660 405 H695 V205 H740" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M695 405 V505 H740" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M350 405 V185 H715 V240 H740" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M350 405 V565 H715 V540 H740" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="740" y="185" width="185" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="832.5" y="215" font-size="20" fill="#0f172a" text-anchor="middle">Експерт 1</text>
<text x="832.5" y="240" font-size="16" fill="#475569" text-anchor="middle">FFN₁(z)</text>
<rect x="740" y="335" width="185" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="832.5" y="365" font-size="20" fill="#0f172a" text-anchor="middle">Експерт 2</text>
<text x="832.5" y="390" font-size="16" fill="#475569" text-anchor="middle">не викликаємо</text>
<rect x="740" y="485" width="185" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="832.5" y="515" font-size="20" fill="#0f172a" text-anchor="middle">Експерт 3</text>
<text x="832.5" y="540" font-size="16" fill="#475569" text-anchor="middle">FFN₃(z)</text>
<path d="M925 225 H985 V345" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="943" y="210" font-size="16" fill="#047857" text-anchor="start">× 0.625</text>
<path d="M925 525 H985 V441" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="943" y="555" font-size="16" fill="#047857" text-anchor="start">× 0.375</text>
<rect x="942" y="345" width="86" height="96" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="985.0" y="375" font-size="20" fill="#0f172a" text-anchor="middle">Σ</text>
<text x="985.0" y="400" font-size="16" fill="#475569" text-anchor="middle">суміш</text>
<path d="M1028 393 H1056" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="1080" cy="400" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1080" y="408" font-size="27" fill="#0f172a" text-anchor="middle">+</text>
<path d="M1104 400 H1160" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1134" y="435" font-size="16" fill="#0f172a" text-anchor="middle">новий x</text>
<text x="36" y="625" font-size="23" fill="#0f172a" text-anchor="start">y = 0.625 · FFN₁(z) + 0.375 · FFN₃(z)       новий x = x + y</text>
<text x="36" y="661" font-size="18" fill="#475569" text-anchor="start">Суцільні стрілки: стани токена / виходи. Пунктир: вибір експертів і ваги router.</text>
<text x="36" y="692" font-size="18" fill="#475569" text-anchor="start">Вибір повторюється для кожного токена; інший токен може обрати інші експерти.</text>
</g></svg>
